services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: searchops
      POSTGRES_PASSWORD: searchops
      POSTGRES_DB: searchops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchops -d searchops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://searchops:searchops@postgres:5432/searchops
      REDIS_URL: redis://redis:6379/0
      SEARCHOPS_SECRET_KEY: ${SEARCHOPS_SECRET_KEY:-dev-only-not-for-production}
      EMBEDDING_PROVIDER: hashed
      RERANKER: heuristic
      DEMO_SEED: "true"
      DEMO_EMAIL: demo@searchops.dev
      DEMO_PASSWORD: demo-password
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
